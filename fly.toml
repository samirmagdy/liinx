app = "raloa-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "15s"
    timeout = "3s"
    path = "/api/health"

[[mounts]]
  source = "raloa_data"
  destination = "/app/data"
  initial_size = "1gb"

[[mounts]]
  source = "raloa_uploads"
  destination = "/app/public/uploads"
  initial_size = "2gb"
